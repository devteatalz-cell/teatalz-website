<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting… — Teatalz Blog</title>

  <!-- ==========================================================================
       REDIRECT SHIM. Posts used to render client-side from this one file at
       /post.html?slug=<slug>. They are now real static pages at /blog/<slug>/,
       generated by tools/prerender.mjs.

       This file exists only so links already shared on WhatsApp, Instagram and
       elsewhere keep working. GitHub Pages serves static files and cannot issue
       a real 301, so this uses the standard static equivalent: a JS replace
       (fires first, and leaves no extra history entry), plus a 0-second meta
       refresh as the no-JS fallback. Google treats both as redirect signals.

       The canonical below is rewritten by the script to point at the specific
       destination post; the static value covers the no-slug case.
       ========================================================================== -->
  <link rel="canonical" id="m-canon" href="https://teatalz.com/blog.html" />
  <script>
    (function () {
      var slug = (new URLSearchParams(location.search)).get("slug") || "";
      // a generated slug is only ever [a-z0-9-]; refuse anything else rather
      // than bounce a visitor to an attacker-supplied path
      var to = (slug && /^[a-z0-9-]+$/.test(slug)) ? "/blog/" + slug + "/" : "/blog.html";
      document.getElementById("m-canon").setAttribute("href", "https://teatalz.com" + to);
      var mr = document.createElement("meta");
      mr.httpEquiv = "refresh";
      mr.content = "0; url=" + to;
      document.head.appendChild(mr);
      location.replace(to);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/blog.html" /></noscript>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="doc">
    <p style="color:var(--ink-2)">This post has moved. <a href="/blog.html">Go to the blog →</a></p>
  </main>
</body>
</html>
