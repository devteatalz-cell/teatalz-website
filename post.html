<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="assets/teatalz-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teatalz Blog</title>
  <meta name="description" id="m-desc" content="A post from the Teatalz blog." />
  <link rel="canonical" id="m-canon" href="https://teatalz.com/blog.html" />
  <meta property="og:type" content="article" />
  <meta property="og:title" id="m-ogt" content="Teatalz Blog" />
  <meta property="og:description" id="m-ogd" content="A post from the Teatalz blog." />
  <meta property="og:image" id="m-ogi" content="" />
  <meta name="theme-color" content="#150a12" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .post-cover{ display:block; width:auto; max-width:min(520px,100%); height:auto; border-radius:18px; margin:8px auto 24px; box-shadow:0 20px 50px rgba(0,0,0,.35); }
    .share-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:30px 0 6px; padding-top:22px; border-top:1px solid var(--border); }
    .share-bar .lbl{ font-size:.9rem; color:var(--ink-2); font-weight:600; }
    .share-bar a, .share-bar button{ display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:.88rem; cursor:pointer;
      padding:9px 14px; border-radius:999px; border:1px solid var(--border); background:var(--glass); color:var(--ink-2); text-decoration:none; transition:.2s; }
    .share-bar a:hover, .share-bar button:hover{ color:#fff; border-color:var(--border-glow); }
    .share-bar .wa:hover{ background:rgba(37,211,102,.2); color:#fff; }
    .post-body{ font-size:1.05rem; line-height:1.8; color:var(--ink); }
    .post-body h2{ font-family:'Space Grotesk',sans-serif; margin:32px 0 10px; }
    .post-body h3{ font-family:'Space Grotesk',sans-serif; margin:24px 0 8px; }
    .post-body p{ margin:0 0 16px; color:var(--ink-2); }
    .post-body img{ max-width:100%; border-radius:12px; margin:12px 0; }
    .post-body a{ color:var(--brand); }
    .post-body ul,.post-body ol{ color:var(--ink-2); margin:0 0 16px; padding-left:22px; line-height:1.8; }
    .post-meta{ font-size:.85rem; color:var(--ink-3); }
  </style>
</head>
<body>
  <main class="doc">
    <a class="back" href="blog.html">← All posts</a>
    <div id="post"><p style="color:var(--ink-3)">Loading…</p></div>
    <p style="margin-top:34px"><a class="btn" href="/#waitlist">Join the Teatalz waitlist →</a></p>
  </main>
  <script src="partials.js"></script>
  <script>
    var URL="https://qypuomwxqcothpashfcv.supabase.co";
    var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5cHVvbXd4cWNvdGhwYXNoZmN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MDgwMTQsImV4cCI6MjEwMDA4NDAxNH0.krPHLNqi9ROa_W-B-MAtBwOGlTr0Vn088E2hFKJDW1o";
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function setMeta(id,attr,val){var el=document.getElementById(id); if(el) el.setAttribute(attr,val);}
    var slug=(new URLSearchParams(location.search)).get("slug")||"";
    if(!slug){ document.getElementById("post").innerHTML='<p style="color:#ff9db0">Post not found.</p>'; }
    else fetch(URL+"/rest/v1/blog_posts?slug=eq."+encodeURIComponent(slug)+"&published=eq.true&select=*",
      {headers:{apikey:ANON,Authorization:"Bearer "+ANON}})
      .then(function(r){return r.json();})
      .then(function(rows){
        var p=rows&&rows[0];
        if(!p){ document.getElementById("post").innerHTML='<p style="color:#ff9db0">This post isn\'t available.</p>'; return; }
        var dt=p.created_at?new Date(p.created_at).toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"}):"";
        document.title=p.title+" — Teatalz Blog";
        var desc=(p.excerpt||p.title||"").slice(0,155);
        setMeta("m-desc","content",desc); setMeta("m-ogt","content",p.title); setMeta("m-ogd","content",desc);
        setMeta("m-canon","href","https://teatalz.com/post.html?slug="+encodeURIComponent(slug));
        if(p.cover_url) setMeta("m-ogi","content",p.cover_url);
        var pageUrl="https://teatalz.com/post.html?slug="+encodeURIComponent(slug);
        var shareTxt=p.title+" — via Teatalz House of Rume";
        var eu=encodeURIComponent(pageUrl), et=encodeURIComponent(shareTxt);
        var share='<div class="share-bar"><span class="lbl">Share:</span>'+
          '<a class="wa" href="https://wa.me/?text='+encodeURIComponent(shareTxt+"  "+pageUrl)+'" target="_blank" rel="noopener">WhatsApp</a>'+
          '<a href="https://twitter.com/intent/tweet?text='+et+'&url='+eu+'" target="_blank" rel="noopener">X</a>'+
          '<a href="https://www.facebook.com/sharer/sharer.php?u='+eu+'" target="_blank" rel="noopener">Facebook</a>'+
          '<a href="https://www.linkedin.com/sharing/share-offsite/?url='+eu+'" target="_blank" rel="noopener">LinkedIn</a>'+
          '<button onclick="navigator.clipboard.writeText(\''+pageUrl+'\');this.textContent=\'Copied \\u2713\'">Copy link</button></div>';
        document.getElementById("post").innerHTML=
          '<h1>'+esc(p.title)+'</h1><p class="post-meta">'+esc(dt)+' · Teatalz House of Rume</p>'+
          (p.cover_url?'<img class="post-cover" src="'+esc(p.cover_url)+'" alt="'+esc(p.title)+'" />':"")+
          '<div class="post-body">'+(p.content_html||"")+'</div>'+share;
        // JSON-LD Article for SEO
        var ld=document.createElement("script"); ld.type="application/ld+json";
        ld.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Article","headline":p.title,
          "description":desc,"datePublished":p.created_at,"author":{"@type":"Organization","name":"Teatalz"},
          "publisher":{"@type":"Organization","name":"Teatalz House of Rume Private Limited"}});
        document.head.appendChild(ld);
      })
      .catch(function(){ document.getElementById("post").innerHTML='<p style="color:#ff9db0">Couldn\'t load this post. Please refresh.</p>'; });
  </script>
</body>
</html>
