<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="assets/teatalz-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog editor — Teatalz</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#150a12" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .ed{ max-width:820px; margin:0 auto; }
    .ed label{ display:block; font-size:.82rem; color:var(--ink-2); font-weight:600; margin:16px 0 6px; }
    .ed input, .ed textarea{ width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
      background:rgba(255,255,255,.04); color:var(--ink); font:inherit; outline:none; }
    .ed input:focus, .ed textarea:focus{ border-color:var(--brand); }
    .tb{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
    .tb button{ font:inherit; font-size:.85rem; padding:6px 11px; border-radius:9px; border:1px solid var(--border);
      background:rgba(255,255,255,.05); color:var(--ink-2); cursor:pointer; }
    .tb button:hover{ background:rgba(124,92,255,.2); color:#fff; }
    #content{ min-height:280px; padding:16px; border:1px solid var(--border); border-radius:12px;
      background:rgba(255,255,255,.03); line-height:1.7; color:var(--ink); }
    #content:focus{ outline:none; border-color:var(--brand); }
    #content img{ max-width:100%; border-radius:10px; }
    .cover-prev{ width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:12px; margin-top:8px; display:none; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:22px; }
    .msg{ font-size:.9rem; margin-top:10px; min-height:1.2em; }
    .msg.ok{ color:#8fe3b0; } .msg.err{ color:#ff9db0; }
    .plist{ margin-top:14px; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .prow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 14px; border-bottom:1px solid rgba(255,255,255,.06); }
    .prow:last-child{ border-bottom:none; }
    .prow .st{ font-size:.72rem; padding:2px 8px; border-radius:999px; }
    .prow .st.pub{ background:rgba(120,220,150,.18); color:#8fe3b0; } .prow .st.dr{ background:rgba(255,255,255,.08); color:var(--ink-3); }
    .lockcard{ max-width:420px; margin:8vh auto 0; text-align:center; }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span></div>
  <main class="doc">

    <section id="lock" class="glass lockcard">
      <div style="font-size:2rem">✍️</div>
      <h1 style="font-size:1.4rem">Blog editor</h1>
      <p style="color:var(--ink-2);font-size:.92rem;margin-bottom:16px">Enter the editor passcode.</p>
      <input id="pc" type="password" placeholder="Editor passcode" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--ink);font:inherit" onkeydown="if(event.key==='Enter')unlock()" />
      <button class="btn" style="width:100%;margin-top:12px" onclick="unlock()">Open editor</button>
      <div id="lockmsg" class="msg"></div>
    </section>

    <section id="ed" class="ed" style="display:none">
      <a class="back" href="blog.html">← View blog</a>
      <h1 id="edtitle">New post</h1>
      <label>Title</label>
      <input id="title" placeholder="A kinder way to talk about mental health" oninput="autoslug()" />
      <label>URL slug</label>
      <input id="slug" placeholder="a-kinder-way-to-talk" />
      <label>Excerpt (1–2 lines, shown on the blog list &amp; in search)</label>
      <textarea id="excerpt" rows="2" placeholder="A short summary that hooks the reader."></textarea>
      <label>Cover image</label>
      <input id="coverfile" type="file" accept="image/*" onchange="pickCover(this)" />
      <img id="coverprev" class="cover-prev" alt="cover preview" />
      <label>Content</label>
      <div class="tb">
        <button type="button" onmousedown="return fmt(event,'formatBlock','h2')">H2</button>
        <button type="button" onmousedown="return fmt(event,'formatBlock','h3')">H3</button>
        <button type="button" onmousedown="return fmt(event,'bold')"><b>B</b></button>
        <button type="button" onmousedown="return fmt(event,'italic')"><i>I</i></button>
        <button type="button" onmousedown="return fmt(event,'insertUnorderedList')">• List</button>
        <button type="button" onmousedown="return mklink(event)">Link</button>
        <button type="button" onmousedown="return fmt(event,'formatBlock','p')">Paragraph</button>
        <button type="button" onclick="document.getElementById('imgfile').click()">Insert image</button>
        <input id="imgfile" type="file" accept="image/*" style="display:none" onchange="insertImg(this)" />
      </div>
      <div id="content" contenteditable="true"><p>Start writing…</p></div>

      <div class="row">
        <button class="btn" onclick="save(true)">Publish</button>
        <button class="btn ghost" onclick="save(false)">Save draft</button>
        <button class="btn ghost" onclick="newPost()">New</button>
        <button class="btn ghost" style="margin-left:auto;color:#ff9db0" onclick="del()">Delete</button>
      </div>
      <div id="msg" class="msg"></div>

      <h2 style="font-size:1.1rem;margin-top:34px">Your posts</h2>
      <div id="plist" class="plist"><div class="prow"><span style="color:var(--ink-3)">Loading…</span></div></div>
    </section>
  </main>

  <script>
    var URL="https://zoceydoogxrpmmlxwhvd.supabase.co";
    var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvY2V5ZG9vZ3hycG1tbHh3aHZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODQ1NDMsImV4cCI6MjEwMDc2MDU0M30.kWNjl0Pqvno7pyiFFmHVScBZGmJ6mqoxoVQMrHbK5eQ";
    var CODE=null, coverData="", editingExisting=false;
    function $(id){return document.getElementById(id);}
    async function rpc(fn, body){ return (await fetch(URL+"/rest/v1/rpc/"+fn,{method:"POST",
      headers:{apikey:ANON,Authorization:"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify(body)})).json(); }

    async function unlock(){
      var v=$("pc").value.trim(); var m=$("lockmsg");
      if(!v){ m.className="msg err"; m.textContent="Enter the passcode."; return; }
      m.className="msg"; m.textContent="Checking…";
      var res=await rpc("blog_admin_list",{code:v});
      if(res && res.ok){ CODE=v; $("lock").style.display="none"; $("ed").style.display="block"; renderList(res.posts||[]); }
      else { m.className="msg err"; m.textContent="Wrong passcode."; }
    }
    function autoslug(){ if(editingExisting) return;
      $("slug").value=$("title").value.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60); }
    function fmt(e,cmd,val){ e.preventDefault(); document.execCommand(cmd,false,val||null); $("content").focus(); return false; }
    function mklink(e){ e.preventDefault(); var u=prompt("Link URL:","https://"); if(u) document.execCommand("createLink",false,u); return false; }

    function resize(file, max, cb){
      var img=new Image(); var fr=new FileReader();
      fr.onload=function(){ img.onload=function(){
        var s=Math.min(1, max/Math.max(img.width,img.height));
        var c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        cb(c.toDataURL("image/jpeg",0.78));
      }; img.src=fr.result; };
      fr.readAsDataURL(file);
    }
    function pickCover(inp){ if(!inp.files[0])return; resize(inp.files[0],1400,function(d){ coverData=d; var p=$("coverprev"); p.src=d; p.style.display="block"; }); }
    function insertImg(inp){ if(!inp.files[0])return; resize(inp.files[0],1200,function(d){ document.execCommand("insertImage",false,d); $("content").focus(); }); inp.value=""; }

    async function save(pub){
      var m=$("msg"); var slug=$("slug").value.trim(), title=$("title").value.trim();
      if(title.length<3){ m.className="msg err"; m.textContent="Add a title."; return; }
      if(!slug){ m.className="msg err"; m.textContent="Add a URL slug."; return; }
      m.className="msg"; m.textContent="Saving…";
      var r=await rpc("blog_publish",{code:CODE,p_slug:slug,p_title:title,p_excerpt:$("excerpt").value.trim(),
        p_cover:coverData||"",p_html:$("content").innerHTML,p_published:pub});
      if(r===true){ m.className="msg ok"; m.textContent=pub?"Published ✓  (live at /post.html?slug="+slug+")":"Draft saved ✓";
        var res=await rpc("blog_admin_list",{code:CODE}); renderList(res.posts||[]); }
      else { m.className="msg err"; m.textContent="Save failed — check the passcode."; }
    }
    function newPost(){ editingExisting=false; $("edtitle").textContent="New post"; $("title").value=""; $("slug").value="";
      $("excerpt").value=""; coverData=""; $("coverprev").style.display="none"; $("content").innerHTML="<p>Start writing…</p>"; $("msg").textContent=""; }
    async function edit(slug){
      var res=await rpc("blog_admin_get",{code:CODE,p_slug:slug}); if(!res||!res.ok||!res.post) return;
      var p=res.post; editingExisting=true; $("edtitle").textContent="Editing: "+p.title;
      $("title").value=p.title; $("slug").value=p.slug; $("excerpt").value=p.excerpt||"";
      coverData=p.cover_url||""; if(coverData){ $("coverprev").src=coverData; $("coverprev").style.display="block"; } else $("coverprev").style.display="none";
      $("content").innerHTML=p.content_html||"<p></p>"; window.scrollTo(0,0);
    }
    async function del(){
      var slug=$("slug").value.trim(); if(!slug) return;
      if(!confirm("Delete “"+slug+"”? This can't be undone.")) return;
      var r=await rpc("blog_delete",{code:CODE,p_slug:slug});
      if(r===true){ newPost(); var res=await rpc("blog_admin_list",{code:CODE}); renderList(res.posts||[]); $("msg").className="msg ok"; $("msg").textContent="Deleted."; }
    }
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function renderList(posts){
      var box=$("plist");
      if(!posts.length){ box.innerHTML='<div class="prow"><span style="color:var(--ink-3)">No posts yet.</span></div>'; return; }
      box.innerHTML=posts.map(function(p){
        return '<div class="prow"><div><b>'+esc(p.title)+'</b> <span class="st '+(p.published?"pub":"dr")+'">'+(p.published?"live":"draft")+'</span></div>'+
               '<button class="btn sm ghost" onclick="edit(\''+esc(p.slug)+'\')">Edit</button></div>';
      }).join("");
    }
  </script>
</body>
</html>
