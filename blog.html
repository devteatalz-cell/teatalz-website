<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog — Teatalz</title>
  <meta name="description" content="Notes on mental wellness, kindness, Hinglish culture, and building Teatalz — a kinder corner of the internet." />
  <link rel="canonical" href="https://teatalz.com/blog.html" />
  <meta property="og:url" content="https://teatalz.com/blog.html" />
  <meta property="og:site_name" content="Teatalz" />
  <meta property="og:title" content="The Teatalz Blog" />
  <meta property="og:description" content="Mental wellness, kindness, and building Teatalz." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#150a12" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .blog-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px; margin-top:26px; }
    .blog-card{ display:flex; flex-direction:column; border:1px solid var(--border); border-radius:18px; overflow:hidden;
      background:var(--glass); text-decoration:none; color:inherit; transition:transform .2s, border-color .2s; }
    .blog-card:hover{ transform:translateY(-4px); border-color:var(--brand); }
    .blog-card .cov{ aspect-ratio:4/5; background:linear-gradient(130deg,#7c5cff,#ff6fb5); display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .blog-card .cov img{ width:100%; height:100%; object-fit:contain; display:block; }
    .blog-card .bd{ padding:16px 18px 20px; }
    .blog-card h3{ font-family:'Space Grotesk',sans-serif; font-size:1.12rem; margin:0 0 6px; line-height:1.3; }
    .blog-card p{ font-size:.92rem; color:var(--ink-2); margin:0; line-height:1.55; }
    .blog-card .dt{ font-size:.78rem; color:var(--ink-3); margin-top:12px; }
  </style>
</head>
<body>
  <main class="doc" style="max-width:1040px">
    <a class="back" href="/">← Back to home</a>
    <h1>The Teatalz Blog</h1>
    <p class="updated">Notes on kindness, mental wellness, and building a kinder corner of the internet.</p>
    <div id="posts" class="blog-grid"><p style="color:var(--ink-3)">Loading…</p></div>
  </main>
  <script src="partials.js"></script>
  <script>
    /* Reads /blog/posts.json, written by tools/prerender.mjs.
       This used to query Supabase directly, which meant pulling every cover
       image as a base64 data URI: 3.3 MB gzipped before a single card could
       render. posts.json is ~6 KB and the covers are now real lazy-loaded
       WebP files. */
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    fetch("/blog/posts.json")
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(posts){
        var box=document.getElementById("posts");
        if(!posts||!posts.length){ box.innerHTML='<p style="color:var(--ink-3)">No posts yet — check back soon. 🌱</p>'; return; }
        box.innerHTML=posts.map(function(p){
          var cov=p.thumb?('<img loading="lazy" decoding="async" width="400" height="500" src="'+esc(p.thumb)+'" alt="'+esc(p.title)+'" />'):"";
          var dt=p.created_at?new Date(p.created_at).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"";
          return '<a class="blog-card" href="'+esc(p.url)+'">'+
                 '<div class="cov">'+cov+'</div>'+
                 '<div class="bd"><h3>'+esc(p.title)+'</h3><p>'+esc(p.excerpt||"")+'</p><div class="dt">'+esc(dt)+'</div></div></a>';
        }).join("");
      })
      .catch(function(){ document.getElementById("posts").innerHTML='<p style="color:#ff9db0">Couldn\'t load posts. Please refresh.</p>'; });
  </script>
</body>
</html>
