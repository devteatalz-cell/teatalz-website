<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel — Ask Ru</title>
<meta name="robots" content="noindex, nofollow">
<!--
  THE FOUNDER'S OWN PANEL.

  FOUNDER, 29 Oct 2026: *"investor dashboard and mera panel"*.

  The investor room (investor.html) shows a count and masked addresses. This is
  the other one: his numbers, unmasked, in one call — who joined, what was read,
  what it cost, what was paid, what went back, and which rows are waiting for a
  person to look at them.

  ── 🔴 ITS OWN PASSCODE, AND IT IS NOT THE INVESTORS' ──────────────────

  `askru_founder_panel` (Ask Ru 0097) checks `founder_passcode_hash`, a separate
  secret. The investor code is given to twenty-five strangers and this page
  carries real email addresses and the day's takings. Until he sets his own hash
  the function answers `{ok:false, reason:"not_set"}` and never falls back.

  ⚠️ THE CODE IS HELD IN MEMORY AND NOWHERE ELSE. Not localStorage, not the URL,
  not a cookie. Closing the tab forgets it, which is the right behaviour for a
  page that prints customers' addresses on somebody's laptop.

  🔴 AND NOTHING HERE DECIDES A NUMBER. Every figure is computed by the database
  when the panel is opened. This file formats; it does not calculate. A page that
  worked out its own totals would be a second opinion about the company.
-->
<style>
  :root {
    color-scheme: dark;
    --paper:     #2a2039;
    --paper-alt: #342647;
    --card:      #372c4a;
    --card-alt:  #3d3152;
    --ink:       #efe6f6;
    --ink-muted: #d6cae4;
    --ink-faint: #b0a2c2;
    --line:      #4d4068;
    --line-faint:#463a5f;
    --plum:      #b89cff;
    --warn:      #ffb4a8;
    --good:      #9ae6b4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(170deg, var(--paper), var(--paper-alt) 60%, var(--paper));
    background-attachment: fixed;
    color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  header.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  header.top h1 { font-size: 22px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  header.top .when { color: var(--ink-faint); font-size: 13px; }
  header.top .sp { flex: 1 1 auto; }

  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card-alt); color: var(--ink); min-height: 40px; padding: 0 16px;
  }
  button.primary { background: var(--plum); color: #241a33; border-color: transparent; font-weight: 600; }
  button[disabled] { opacity: .55; cursor: default; }

  /* ---- the gate ---- */
  .gate { max-width: 380px; margin: 8vh auto 0; background: var(--card); border: 1px solid var(--line);
          border-radius: 18px; padding: 28px 24px; text-align: center; }
  .gate h1 { font-size: 20px; margin: 0 0 6px; }
  .gate p { color: var(--ink-muted); margin: 0 0 18px; font-size: 14px; }
  .gate input { width: 100%; min-height: 46px; padding: 0 14px; border-radius: 10px;
                border: 1px solid var(--line); background: var(--paper); color: var(--ink);
                font: inherit; margin-bottom: 12px; }
  .gate button { width: 100%; }
  .msg { margin: 12px 0 0; font-size: 14px; min-height: 20px; }
  .msg.err { color: var(--warn); }

  /* ---- sections ---- */
  section.sec { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
                padding: 20px 22px; margin: 0 0 16px; }
  section.sec > h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
                     color: var(--ink-faint); margin: 0 0 14px; font-weight: 600; }
  /* The one section that is red when it has anything in it, and absent when it
     does not. A panel that always shows "0 problems" trains you to skip it. */
  section.sec.alarm { border-color: var(--warn); }
  section.sec.alarm > h2 { color: var(--warn); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .stat .n { font-size: 27px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .stat .l { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }
  .stat .sub { font-size: 12.5px; color: var(--ink-muted); margin-top: 4px; }

  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 14px 8px 0; border-bottom: 1px solid var(--line-faint); white-space: nowrap; }
  th { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  /* The gutter goes only from the LAST column. Taking it from every right
     aligned cell ran the rank into the name: "1431Vikram". */
  td:last-child, th:last-child { padding-right: 0; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  td.dim { color: var(--ink-faint); }

  .note { color: var(--ink-faint); font-size: 12.5px; margin: 10px 0 0; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px 22px; font-size: 13.5px; }
  .kv div { display: flex; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line-faint); padding: 6px 0; }
  .kv b { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .kv span { color: var(--ink-faint); }

  @media (max-width: 560px) {
    body { padding: 16px 16px 48px; }
    section.sec { padding: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ---- the gate ---- -->
  <div class="gate" id="gate">
    <h1>Panel</h1>
    <p>Ask Ru, everything. Your code — not the investors’.</p>
    <form id="f-gate" autocomplete="off">
      <input id="code" type="password" placeholder="Code" autocomplete="off" autocapitalize="off" spellcheck="false" required />
      <button class="primary" type="submit" id="go">Open</button>
    </form>
    <p class="msg" id="gatemsg" role="status" aria-live="polite"></p>
  </div>

  <!-- ---- the panel ---- -->
  <div id="panel" hidden>
    <header class="top">
      <h1>Ask Ru</h1>
      <span class="when" id="when"></span>
      <span class="sp"></span>
      <button type="button" id="refresh">Refresh</button>
    </header>
    <div id="body"></div>
  </div>

</div>
<script>
(function () {
  var URL_  = "https://hyxkhjxrpsmjztbdtcee.supabase.co";
  /* The project's public anon key, the same one investor.html carries. It is
     not a secret and it opens nothing on its own: `askru_founder_panel` takes
     the code and checks it server-side. */
  var ANON  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5eGtoanhycHNtanp0YmR0Y2VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNjc3MTgsImV4cCI6MjEwNDg0MzcxOH0.203raeaoCf_t6nawo1IkFm-Ayc5uMti-WkxksYn3ORs";

  /* 🔴 IN MEMORY, NOWHERE ELSE. See the file header. */
  var CODE = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  /* Rupees as a person writes them, from a number the SERVER worked out. */
  function rs(n) {
    var v = Number(n);
    if (!isFinite(v)) return "—";
    /* Two decimals when there is a fraction, none when there is not: ₹63.80
       and ₹51, never ₹63.8 or ₹51.00. */
    return "₹" + v.toLocaleString("en-IN", {
      minimumFractionDigits: (v % 1 === 0 ? 0 : 2), maximumFractionDigits: 2 });
  }
  function num(n) {
    var v = Number(n);
    return isFinite(v) ? v.toLocaleString("en-IN") : "—";
  }
  /* IST, because it is the only timezone this company works in. */
  function day(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    try { return d.toLocaleDateString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short" }); }
    catch (e) { return d.toISOString().slice(0, 10); }
  }
  function stamp(iso) {
    var d = iso ? new Date(iso) : new Date();
    if (isNaN(d.getTime())) return "";
    try { return d.toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + " IST"; }
    catch (e) { return ""; }
  }

  function call(code) {
    return fetch(URL_ + "/rest/v1/rpc/askru_founder_panel", {
      method: "POST",
      headers: { apikey: ANON, authorization: "Bearer " + ANON, "content-type": "application/json" },
      body: JSON.stringify({ code: code })
    });
  }

  function stat(n, label, sub) {
    return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + esc(label) + '</div>'
      + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }

  function table(headers, rows) {
    if (!rows.length) return '<p class="note">Nothing yet.</p>';
    var th = headers.map(function (h) {
      return '<th' + (h.num ? ' class="num"' : '') + '>' + esc(h.t) + '</th>';
    }).join("");
    return '<div class="tw"><table><thead><tr>' + th + '</tr></thead><tbody>'
      + rows.join("") + '</tbody></table></div>';
  }

  function render(d) {
    var out = [];
    var h = d.needs_a_human || {};
    var cfg = d.config || {};
    var wl = d.waitlist || {};
    var rd = d.readings || {};
    var sp = d.spend || {};
    var mo = d.money || {};
    var rf = d.refunds || {};

    /* ── 1. only when there is something ──────────────────────────────
       🔴 ABSENT WHEN THERE IS NOTHING TO SAY. A red box that reads "0" every
       day is a box nobody reads on the day it says 3. */
    var alarms = [];
    if (Number(rf.shortfall_rupees) > 0) {
      alarms.push(stat('<span style="color:var(--warn)">' + rs(rf.shortfall_rupees) + '</span>',
        "refunded but not recovered", "spent before the money went back"));
    }
    if (Number(h.refunds_unmatched) > 0) {
      alarms.push(stat('<span style="color:var(--warn)">' + num(h.refunds_unmatched) + '</span>',
        "refunds with no order", "no payment mapping — match by hand"));
    }
    if (Number(h.refunds_refused) > 0) {
      alarms.push(stat('<span style="color:var(--warn)">' + num(h.refunds_refused) + '</span>',
        "refunds refused", "over-refund or mode mismatch"));
    }
    if (Number(h.stuck_recharges) > 0 || Number(h.stuck_dakshina) > 0) {
      alarms.push(stat('<span style="color:var(--warn)">' + num(Number(h.stuck_recharges || 0) + Number(h.stuck_dakshina || 0)) + '</span>',
        "orders opened, never paid", "older than two hours — usually just abandoned"));
    }
    if (alarms.length) {
      out.push('<section class="sec alarm"><h2>Look at this</h2><div class="grid">' + alarms.join("") + '</div></section>');
    }

    /* ── 2. today ──────────────────────────────────────────────────── */
    var seatsTaken = Number(rd.seats_taken || 0), seatsTotal = Number(rd.seats_total || 0);
    var seatsLeft = seatsTotal ? Math.max(0, seatsTotal - seatsTaken) : null;
    out.push('<section class="sec"><h2>Today</h2><div class="grid">'
      + stat(num(wl.today), "joined the list today", "this week " + num(wl.week))
      + stat(num(rd.web_today), "readings on the website", "app calls " + num(rd.app_calls_today))
      + stat(rs(sp.today_rupees), "spent on models today", esc(sp.note || ""))
      + (seatsLeft === null ? "" : stat(num(seatsLeft), "free seats left", num(seatsTaken) + " of " + num(seatsTotal) + " taken"))
      + '</div></section>');

    /* ── 3. the list ───────────────────────────────────────────────── */
    var wlRows = (wl.recent || []).map(function (p) {
      return '<tr><td class="num dim">' + (p.rank == null ? "—" : esc(String(p.rank))) + '</td>'
        + '<td>' + esc(p.name || "—") + '</td>'
        + '<td class="mono">' + esc(p.email || "—") + '</td>'
        + '<td>' + esc(p.language || "—") + '</td>'
        + '<td class="mono dim">' + esc(p.mobile || "—") + '</td>'
        + '<td class="dim">' + esc(p.source || "—") + '</td>'
        + '<td class="dim">' + esc(day(p.joined)) + '</td></tr>';
    });
    out.push('<section class="sec"><h2>The waiting list — ' + num(wl.total) + '</h2>'
      + table([{ t: "#", num: true }, { t: "Name" }, { t: "Email" }, { t: "Language" }, { t: "Mobile" }, { t: "Source" }, { t: "Joined" }], wlRows)
      + ((wl.recent || []).length < Number(wl.total || 0)
        ? '<p class="note">Showing the ' + (wl.recent || []).length + ' most recent of ' + num(wl.total) + '.</p>' : "")
      + '</section>');

    /* ── 4. readings and what they cost ────────────────────────────── */
    var modeRows = (rd.by_mode || []).map(function (m) {
      return '<tr><td>' + esc(m.mode) + '</td>'
        + '<td class="num">' + num(m.readings) + '</td>'
        + '<td class="num">' + rs(m.rupees) + '</td>'
        + '<td class="num dim">' + rs(m.rupees_each) + '</td></tr>';
    });
    var dayRows = (sp.by_day || []).map(function (x) {
      return '<tr><td>' + esc(day(x.day)) + '</td><td class="num">' + rs(x.rupees) + '</td></tr>';
    });
    out.push('<section class="sec"><h2>Readings and what they cost</h2><div class="grid">'
      + stat(num(rd.web_total), "website readings, all time")
      + stat(num(rd.app_calls_total), "app model calls, all time")
      + stat(rs(sp.web_rupees), "website, all time")
      + stat(rs(sp.app_rupees), "app, all time")
      + '</div>'
      + '<div style="margin-top:18px">' + table([{ t: "Mode" }, { t: "Readings", num: true }, { t: "Cost", num: true }, { t: "Each", num: true }], modeRows) + '</div>'
      + '<div style="margin-top:18px">' + table([{ t: "Day" }, { t: "Spend", num: true }], dayRows) + '</div>'
      /* ⚠️ Said on the page, not just in the code: this is our price list. */
      + '<p class="note">' + esc(sp.note || "") + ". The real draw-down is in the provider's console.</p>"
      + '</section>');

    /* ── 5. money in ───────────────────────────────────────────────── */
    function statusRows(arr) {
      return (arr || []).map(function (s) {
        return '<tr><td>' + esc(s.status) + '</td><td class="num">' + num(s.orders) + '</td>'
          + '<td class="num">' + rs(s.rupees) + '</td></tr>';
      });
    }
    var moneyBlocks = [
      ["Wallet recharges", mo.recharges],
      ["Dakshina", mo.dakshina],
      ["Readings bought", mo.paid_readings]
    ].map(function (p) {
      return '<div style="margin-top:14px"><div class="l" style="font-size:12.5px;color:var(--ink-faint);margin-bottom:6px">'
        + esc(p[0]) + '</div>'
        + table([{ t: "Status" }, { t: "Orders", num: true }, { t: "Rupees", num: true }], statusRows(p[1])) + '</div>';
    }).join("");
    out.push('<section class="sec"><h2>Money in</h2><div class="grid">'
      + stat(rs(mo.wallets_held), "held in wallets", num(mo.wallets_with_money) + " with a balance")
      + '</div>' + moneyBlocks + '</section>');

    /* ── 6. money out ──────────────────────────────────────────────── */
    var refRows = (rf.rows || []).map(function (r) {
      return '<tr><td class="mono">' + esc(r.provider_ref) + '</td>'
        + '<td>' + esc(r.cause) + '</td>'
        + '<td class="dim">' + esc(r.order_kind || "—") + '</td>'
        + '<td class="num">' + rs(r.rupees) + '</td>'
        + '<td class="num dim">' + rs(r.clawed) + '</td>'
        + '<td class="num">' + (Number(r.shortfall) > 0 ? '<span style="color:var(--warn)">' + rs(r.shortfall) + '</span>' : rs(r.shortfall)) + '</td>'
        + '<td>' + esc(r.outcome) + '</td>'
        + '<td class="dim">' + esc(day(r.created_at)) + '</td></tr>';
    });
    out.push('<section class="sec"><h2>Money out</h2>'
      + table([{ t: "Refund" }, { t: "Cause" }, { t: "Kind" }, { t: "Back", num: true }, { t: "Taken", num: true }, { t: "Short", num: true }, { t: "Outcome" }, { t: "When" }], refRows)
      + '<p class="note">Refunds start in Razorpay, never here. "Short" is money that went back and could not be taken out of a wallet because it had already been spent.</p>'
      + '</section>');

    /* ── 7. the switches, as they actually are ─────────────────────── */
    var keys = Object.keys(cfg).sort();
    out.push('<section class="sec"><h2>Switches</h2><div class="kv">'
      + keys.map(function (k) {
        var v = cfg[k];
        return '<div><span>' + esc(k) + '</span><b>' + esc(typeof v === "string" ? v : JSON.stringify(v)) + '</b></div>';
      }).join("")
      + '</div><p class="note">Read from the database as it is now. Changing one of these changes what everybody gets.</p></section>');

    $("body").innerHTML = out.join("");
    $("when").textContent = "as of " + stamp(d.at);
  }

  function load(code, msgEl, btn) {
    if (btn) btn.disabled = true;
    return call(code).then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (d) {
      if (btn) btn.disabled = false;
      if (!d || d.ok !== true) {
        var why = d && d.reason === "not_set"
          ? "No panel code is set yet. Set one in the database first — the migration says how."
          : d && d.reason === "locked"
            ? "Too many wrong codes in the last hour. It opens again by itself."
            : "That code didn’t work.";
        if (msgEl) { msgEl.className = "msg err"; msgEl.textContent = why; }
        return false;
      }
      CODE = code;
      $("gate").hidden = true;
      $("panel").hidden = false;
      render(d);
      return true;
    }).catch(function () {
      if (btn) btn.disabled = false;
      if (msgEl) { msgEl.className = "msg err"; msgEl.textContent = "Couldn’t reach the database. Try again."; }
      return false;
    });
  }

  $("f-gate").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("code").value.trim();
    var m = $("gatemsg");
    if (!v) { m.className = "msg err"; m.textContent = "Enter your code."; return; }
    m.className = "msg"; m.textContent = "Opening…";
    load(v, m, $("go")).then(function (ok) {
      /* Cleared either way: it is in `CODE` now, and a filled password box is
         one shoulder away from being read. */
      $("code").value = "";
      if (ok) m.textContent = "";
    });
  });

  $("refresh").addEventListener("click", function () {
    if (!CODE) return;
    var b = $("refresh");
    b.textContent = "Refreshing…";
    load(CODE, null, b).then(function () { b.textContent = "Refresh"; });
  });
}());
</script>
</body>
</html>
