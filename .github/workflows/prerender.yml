name: Prerender blog

# Turns the Supabase blog into real static files (see tools/prerender.mjs) and
# commits them back, which is what makes GitHub Pages redeploy.
#
# Deliberately NOT wired to the publish path yet. A generator that runs on every
# publish is worse than a slightly stale index if it ever breaks, so this runs on
# a schedule plus a manual button until it has proven itself. Once it has, the
# intended upgrade is a Supabase trigger calling repository_dispatch via pg_net
# (the same mechanism already used for the waitlist emails).

# SCHEDULE DISABLED — founder ruling, 6 August 2026.
#
# Asked whether pressing publish in the console counted as his approval for the
# post reaching teatalz.com, he answered no: "ask me before anything appears".
# His standing rule is that nothing reaches a live surface without an explicit
# yes, and an hourly job meant the console button WAS the publish button.
#
# The manual trigger stays. Publishing is now: he says yes, someone runs the
# workflow. To restore automatic publishing, uncomment the schedule block — but
# that reverses a founder ruling, so do not do it without asking him.
on:
  # schedule:
  #   - cron: '0 * * * *'        # hourly, on the hour (UTC)
  workflow_dispatch: {}          # manual "Run workflow" button — the only trigger now

concurrency:
  group: teatalz-prerender
  cancel-in-progress: false

permissions:
  contents: write                # needed to commit the generated files

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm install`, not `npm ci` — sharp ships platform-specific optional
      # binaries and a lockfile resolved on Windows does not carry the linux-x64
      # ones, which makes `npm ci` fail here.
      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node tools/prerender.mjs

      # Only ever stages blog/ and sitemap.xml. If the generator somehow touched
      # anything else, that change is left uncommitted rather than shipped.
      - name: Commit generated files
        run: |
          git config user.name  "teatalz-prerender[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -- blog sitemap.xml
          if git diff --cached --quiet; then
            echo "no blog changes — nothing to commit"
            exit 0
          fi
          git diff --cached --name-only
          git commit -m "blog: regenerate static posts + sitemap [skip ci]"
          git push
